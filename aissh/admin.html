<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>aissh · 设备与访问权限</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1e293b;background:#f4f6fa}body{max-width:1120px;margin:40px auto;padding:0 24px}h1{letter-spacing:-1px;margin-bottom:8px}p{color:#64748b;line-height:1.7}.panel{background:white;padding:24px;border:1px solid #e2e8f0;border-radius:14px;margin:24px 0;overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:14px 8px;border-bottom:1px solid #e2e8f0;font-size:14px}small{display:block;color:#64748b;margin-top:5px}code{font-size:12px}button,select{border:1px solid #cbd5e1;border-radius:7px;padding:9px 12px;background:#fff;margin:4px}button{cursor:pointer}button.primary{background:#2563eb;color:#fff;border-color:#2563eb}button.danger{color:#b91c1c;border-color:#fecaca}.device-actions{white-space:nowrap}.status{color:#15803d}.off{color:#64748b}#message{color:#b91c1c;white-space:pre-wrap}form{display:flex;flex-wrap:wrap;align-items:center;gap:8px}h2{font-size:18px;margin-top:0}
</style>
<h1>aissh</h1><p>设备自动注册。由你决定谁可以访问谁；未授权的设备不能建立 SSH 隧道。</p><div id="message" role="status"></div>
<section class="panel"><h2>设备</h2><table><thead><tr><th>设备</th><th>MAC 地址</th><th>SSH 用户名</th><th>状态</th><th>操作</th></tr></thead><tbody id="devices"></tbody></table></section>
<section class="panel"><h2>添加访问权限</h2><form id="grant"><label>访问端 <select id="source" required></select></label><span>→</span><label>目标端 <select id="target" required></select></label><button id="allow" class="primary" type="submit">允许访问</button></form><p>权限是单向的。客户端会自动创建本地 SSH 入口；SSH 使用目标设备的系统账户及密码，账户名由目标客户端上报。</p></section>
<section class="panel"><h2>已授权连接</h2><table><thead><tr><th>访问端</th><th>目标端</th><th>访问端上的 SSH 命令</th><th>操作</th></tr></thead><tbody id="rules"></tbody></table></section>
<script>
const $=id=>document.getElementById(id);let state={devices:[],rules:[]};
function text(tag,value){const e=document.createElement(tag);e.textContent=value;return e}
function cell(row,value){const e=document.createElement('td');if(value instanceof Node)e.append(value);else e.textContent=value;row.append(e);return e}
async function api(path,body){const res=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(!res.ok){const e=await res.json().catch(()=>({error:'请求失败'}));throw Error(e.error||'请求失败')}return res.json()}
async function action(path,body){try{await api(path,body);$('message').textContent='';await refresh()}catch(e){$('message').textContent=e.message}}
async function refresh(){try{state=await api('/api/state');render();$('message').textContent=''}catch(e){$('message').textContent=e.message}}
function render(){const ds=$('devices');ds.replaceChildren();for(const d of state.devices){const row=document.createElement('tr');const name=text('div',d.name||d.id);name.append(text('small',d.id+' · '+d.os));cell(row,name);cell(row,d.macs.join(', '));const account=text('div',d.username||'未上报（请更新客户端）');if(d.account&&d.account!==d.username)account.append(text('small','运行账户：'+d.account));cell(row,account);const online=d.online;cell(row,!d.enabled?'已禁用':online?'在线':'离线');const b=text('button',d.enabled?'禁用':'启用');b.onclick=()=>action('/api/devices',{id:d.id,enabled:!d.enabled});const actions=document.createElement('div');actions.className='device-actions';actions.append(b);const remove=text('button','删除');remove.className='danger';remove.onclick=()=>{if(confirm(`删除设备“${d.name||d.id}”？\n设备 ID：${d.id}\n将同时移除该设备的全部访问授权并断开现有连接。\n如果客户端仍在运行，设备会重新注册，需要重新授权。`))action('/api/devices/delete',{id:d.id})};actions.append(remove);cell(row,actions);ds.append(row)}if(!state.devices.length){const row=document.createElement('tr');const td=cell(row,'暂无设备，请在电脑上运行 aisshc。');td.colSpan=5;ds.append(row)}
syncDeviceSelect($('source'),state.devices.filter(d=>d.enabled));syncTargets();
const name=id=>state.devices.find(d=>d.id===id)?.name||id;const quote=s=>"'"+s.replaceAll("'","'\"'\"'")+"'";const rules=$('rules');rules.replaceChildren();for(const r of state.rules){const row=document.createElement('tr');cell(row,name(r.source));cell(row,name(r.target));cell(row,text('code',`ssh -p ${r.port} -l ${quote(state.devices.find(d=>d.id===r.target)?.username||'用户名')} 127.0.0.1`));const b=text('button','撤销');b.onclick=()=>action('/api/rules',{...r,port:undefined,allow:false});cell(row,b);rules.append(row)}}
function syncDeviceSelect(select,devices){const options=devices.map(d=>({value:d.id,label:(d.name||'未命名')+' · '+d.id.slice(-8)}));const current=[...select.options].map(o=>({value:o.value,label:o.textContent}));if(JSON.stringify(current)===JSON.stringify(options))return;const prev=select.value;select.replaceChildren();for(const o of options){const option=text('option',o.label);option.value=o.value;select.append(option)}if(options.some(o=>o.value===prev))select.value=prev}
function syncTargets(){const source=$('source').value;syncDeviceSelect($('target'),state.devices.filter(d=>d.enabled&&d.id!==source));$('allow').disabled=!source||!$('target').value}
$('source').onchange=syncTargets;
$('grant').onsubmit=e=>{e.preventDefault();const source=$('source').value,target=$('target').value;if(!source||!target||source===target){$('message').textContent='请选择两台不同的设备';return}action('/api/rules',{source,target,allow:true})};refresh();setInterval(refresh,5000);
</script></html>
