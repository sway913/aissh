<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>aissh · 设备与访问权限</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1e293b;background:#f4f6fa}body{max-width:1120px;margin:40px auto;padding:0 24px}h1{letter-spacing:-1px;margin-bottom:8px}p{color:#64748b;line-height:1.7}.panel{background:white;padding:24px;border:1px solid #e2e8f0;border-radius:14px;margin:24px 0;overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:14px 8px;border-bottom:1px solid #e2e8f0;font-size:14px}small{display:block;color:#64748b;margin-top:5px}code{font-size:12px}button,select{border:1px solid #cbd5e1;border-radius:7px;padding:9px 12px;background:#fff;margin:4px}button{cursor:pointer}button.primary{background:#2563eb;color:#fff;border-color:#2563eb}button.danger{color:#b91c1c;border-color:#fecaca}.device-actions{white-space:nowrap}.device-summary{min-width:200px;max-width:280px;overflow-wrap:anywhere}.status{color:#15803d}.off{color:#64748b}#message{color:#b91c1c;white-space:pre-wrap}form{display:flex;flex-wrap:wrap;align-items:center;gap:8px}h2{font-size:18px;margin-top:0}

.rules-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px}.rules-toolbar input{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:7px;padding:10px 12px;font:inherit;font-size:14px}.rules-toolbar button{margin:0}.rules-count{font-size:13px;color:#64748b}.rule-group{border:1px solid #e2e8f0;border-radius:10px;margin-top:12px;overflow:hidden}.rule-group>summary{cursor:pointer;padding:16px;background:#f8fafc;display:flex;align-items:center;gap:12px;list-style:none}.rule-group>summary::-webkit-details-marker{display:none}.rule-group>summary::before{content:'›';font-size:24px;color:#64748b;transition:transform .15s}.rule-group[open]>summary::before{transform:rotate(90deg)}.rule-group>summary .device-summary{flex:1;max-width:none;min-width:0}.rule-group>summary .device-summary>small{font-size:12px}.group-count{flex-shrink:0;background:#e2e8f0;border-radius:20px;padding:5px 10px;font-size:12px;color:#475569}.rule-table{overflow:auto;padding:0 16px 8px}.rule-table table{min-width:620px}.rule-table td:first-child{width:44%}.rule-table td:last-child{white-space:nowrap}.command{display:flex;align-items:center;gap:8px}.command code{white-space:nowrap;user-select:all;background:#f4f6fa;border-radius:6px;padding:9px}.command button{white-space:nowrap;margin:0}.empty{padding:24px;text-align:center;color:#64748b}.rules-hint{font-size:13px;margin:0 0 12px}button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2563eb;outline-offset:3px}@media(max-width:640px){body{padding:0 12px;margin:24px auto}.panel{padding:16px}.rules-toolbar input{min-width:100%;box-sizing:border-box}.rule-group>summary{padding:12px;gap:8px}.group-count{padding:4px 8px}}

.device-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}.device-toolbar input{flex:1;min-width:240px;border:1px solid #cbd5e1;border-radius:7px;padding:10px 12px;font:inherit;font-size:14px}.device-toolbar select,.device-toolbar button{margin:0}.device-toolbar label{font-size:13px;color:#64748b;display:flex;align-items:center;gap:6px}.device-count{font-size:13px;color:#64748b;margin-bottom:8px}.devices-scroll{max-height:580px;overflow:auto;border:1px solid #e2e8f0;border-radius:8px}.devices-scroll table{min-width:850px}.devices-scroll th{position:sticky;top:0;z-index:1;background:#f8fafc}.devices-scroll td{padding:11px 8px}.devices-scroll td:first-child{min-width:220px;max-width:320px;overflow-wrap:anywhere}.devices-scroll small{font-size:11px}.devices-scroll td:nth-child(3){max-width:220px;overflow-wrap:anywhere}.device-status{display:inline-block;border-radius:20px;padding:4px 9px;font-size:12px;white-space:nowrap}.device-status.status{background:#dcfce7}.device-status.off{background:#f1f5f9}.device-status.disabled{background:#fef3c7;color:#92400e}.device-pagination{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px;color:#64748b}.device-pagination .page-total{flex:1}.device-pagination button,.device-pagination select{margin:0}button:disabled{opacity:.45;cursor:default}@media(max-width:640px){.device-toolbar input{min-width:100%;box-sizing:border-box}.device-toolbar label{flex:1}.device-pagination .page-total{min-width:100%}}
</style>
<h1>aissh</h1><p>设备自动注册。由你决定谁可以访问谁；未授权的设备不能建立 SSH 隧道。</p><div id="message" role="status"></div>
<section class="panel"><h2>设备</h2><div id="device-count" class="device-count" aria-live="polite"></div><div class="device-toolbar"><input id="device-search" type="search" aria-label="搜索设备" placeholder="搜索机器名、设备 ID、MAC 或账户"><label>状态 <select id="device-status" aria-label="设备状态"><option value="all">全部状态</option><option value="online">在线</option><option value="offline">离线</option><option value="disabled">已禁用</option></select></label><label>系统 <select id="device-os" aria-label="设备系统"><option value="all">全部系统</option></select></label><label>排序 <select id="device-sort" aria-label="设备排序"><option value="online">在线优先</option><option value="name">机器名</option><option value="newest">最近注册</option><option value="seen">最近上报</option></select></label><button id="device-reset" type="button">重置筛选</button></div><div class="devices-scroll"><table><thead><tr><th>设备</th><th>MAC 地址</th><th>SSH 用户名</th><th>状态</th><th>操作</th></tr></thead><tbody id="devices"></tbody></table></div><div class="device-pagination"><span id="device-page-total" class="page-total" aria-live="polite"></span><label>每页 <select id="device-page-size" aria-label="每页设备数量"><option value="10">10 条</option><option value="25">25 条</option><option value="50">50 条</option></select></label><button id="device-prev" type="button">上一页</button><span id="device-page-number"></span><button id="device-next" type="button">下一页</button></div></section>
<section class="panel"><h2>添加访问权限</h2><form id="grant"><label>访问端 <select id="source" required></select></label><span>→</span><label>目标端 <select id="target" required></select></label><button id="allow" class="primary" type="submit">允许访问</button></form><p>权限是单向的。客户端会自动创建本地 SSH 入口；SSH 使用目标设备的系统账户及密码，账户名由目标客户端上报。</p></section>
<section class="panel"><h2>已授权连接</h2><div class="rules-toolbar"><input id="rule-search" type="search" aria-label="搜索已授权连接" placeholder="搜索机器名、设备 ID、MAC 或端口"><button id="expand-all" type="button">展开全部</button><button id="collapse-all" type="button">收起全部</button><span id="rules-count" class="rules-count" aria-live="polite"></span></div><p class="rules-hint">按访问端分组；在对应访问端的终端执行 SSH 命令。点击机器名所在行可展开或收起。</p><div id="rules"></div><small id="copy-status" role="status" aria-live="polite"></small></section>
<script>
const $=id=>document.getElementById(id);let state={devices:[],rules:[]};
function text(tag,value){const e=document.createElement(tag);e.textContent=value;return e}
function cell(row,value){const e=document.createElement('td');if(value instanceof Node)e.append(value);else e.textContent=value;row.append(e);return e}
function deviceSummary(id){const d=state.devices.find(d=>d.id===id);const summary=text('div',d?.name||id);summary.className='device-summary';if(d){summary.append(text('small',d.id+' · '+d.os));summary.append(text('small','MAC：'+(d.macs?.join(', ')||'未上报')))}return summary}
async function api(path,body){const res=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(!res.ok){const e=await res.json().catch(()=>({error:'请求失败'}));throw Error(e.error||'请求失败')}return res.json()}
async function action(path,body){try{await api(path,body);$('message').textContent='';await refresh()}catch(e){$('message').textContent=e.message}}
async function refresh(){try{state=await api('/api/state');render();$('message').textContent=''}catch(e){$('message').textContent=e.message}}
let devicePage=1;let deviceSignature='';
function deviceStatus(d){return !d.enabled?'disabled':d.online?'online':'offline'}
function renderDevices(){
 const query=$('device-search').value.trim().toLowerCase(),status=$('device-status').value,os=$('device-os').value,sort=$('device-sort').value,size=Number($('device-page-size').value);
 const osNames={windows:'Windows',linux:'Linux',darwin:'macOS'};const systems=[...new Set(['windows','linux','darwin',...state.devices.map(d=>d.os).filter(Boolean),...(os!=='all'?[os]:[])])].sort();
 const osOptions=[{value:'all',label:'全部系统'},...systems.map(value=>({value,label:osNames[value]||value}))];
 if(JSON.stringify([...$('device-os').options].map(o=>({value:o.value,label:o.textContent})))!==JSON.stringify(osOptions)){$('device-os').replaceChildren();for(const o of osOptions){const option=text('option',o.label);option.value=o.value;$('device-os').append(option)}$('device-os').value=os}
 const counts={online:0,offline:0,disabled:0};for(const d of state.devices)counts[deviceStatus(d)]++;
 $('device-count').textContent=`共 ${state.devices.length} 台 · 在线 ${counts.online} · 离线 ${counts.offline} · 已禁用 ${counts.disabled}`;
 const matched=state.devices.filter(d=>(status==='all'||deviceStatus(d)===status)&&(os==='all'||d.os===os)&&(!query||[d.name,d.id,d.username,d.account,...(d.macs||[])].join(' ').toLowerCase().includes(query)));
 const byName=(a,b)=>(a.name||a.id).localeCompare(b.name||b.id,'zh-CN',{numeric:true})||a.id.localeCompare(b.id);const stamp=value=>{const n=Date.parse(value);return Number.isNaN(n)?0:n};const rank={online:0,offline:1,disabled:2};
 matched.sort((a,b)=>(sort==='online'?rank[deviceStatus(a)]-rank[deviceStatus(b)]:sort==='newest'?stamp(b.created)-stamp(a.created):sort==='seen'?stamp(b.lastSeen)-stamp(a.lastSeen):0)||byName(a,b));
 const pages=Math.max(1,Math.ceil(matched.length/size));devicePage=Math.min(Math.max(1,devicePage),pages);const start=(devicePage-1)*size;const visible=matched.slice(start,start+size);
 $('device-page-total').textContent=matched.length?`显示 ${start+1}–${start+visible.length} 条 · 匹配 ${matched.length} / 共 ${state.devices.length} 台`:`匹配 0 / 共 ${state.devices.length} 台`;
 $('device-page-number').textContent=`${devicePage} / ${pages}`;$('device-prev').disabled=devicePage===1;$('device-next').disabled=devicePage===pages;
 const signature=JSON.stringify(visible.map(d=>[d.id,d.name,d.os,d.macs,d.username,d.account,d.enabled,d.online,d.online?null:d.lastSeen]));
 const emptyText=state.devices.length?'没有匹配的设备，请调整搜索或筛选条件。':'暂无设备，请在电脑上运行 aisshc。';
 if(deviceSignature===signature+emptyText)return;deviceSignature=signature+emptyText;
 const ds=$('devices');ds.replaceChildren();for(const d of visible){const row=document.createElement('tr');const name=text('div',d.name||d.id);name.append(text('small',d.id+' · '+d.os));cell(row,name);cell(row,d.macs.join(', '));const account=text('div',d.username||'未上报（请更新客户端）');if(d.account&&d.account!==d.username)account.append(text('small','运行账户：'+d.account));cell(row,account);const badge=text('span',deviceStatus(d)==='disabled'?'已禁用':deviceStatus(d)==='online'?'在线':'离线');badge.className='device-status '+(deviceStatus(d)==='disabled'?'disabled':deviceStatus(d)==='online'?'status':'off');const statusCell=cell(row,badge);if(!d.online&&d.lastSeen){const seen=new Date(d.lastSeen);if(!Number.isNaN(seen.getTime())){const last=text('small','最近上报：'+seen.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}));last.title=seen.toLocaleString('zh-CN');statusCell.append(last)}}const b=text('button',d.enabled?'禁用':'启用');b.onclick=()=>action('/api/devices',{id:d.id,enabled:!d.enabled});const actions=document.createElement('div');actions.className='device-actions';actions.append(b);const remove=text('button','删除');remove.className='danger';remove.onclick=()=>{if(confirm(`删除设备“${d.name||d.id}”？\n设备 ID：${d.id}\n将同时移除该设备的全部访问授权并断开现有连接。\n如果客户端仍在运行，设备会重新注册，需要重新授权。`))action('/api/devices/delete',{id:d.id})};actions.append(remove);cell(row,actions);ds.append(row)}
 if(!visible.length){const row=document.createElement('tr');const td=cell(row,emptyText);td.colSpan=5;td.className='empty';ds.append(row)}
}
function resetDevicePage(){devicePage=1;renderDevices();$('devices').closest('.devices-scroll').scrollTop=0}
$('device-search').oninput=resetDevicePage;
for(const id of ['device-status','device-os','device-sort','device-page-size'])$(id).onchange=resetDevicePage;
function moveDevicePage(delta){devicePage+=delta;renderDevices();$('devices').closest('.devices-scroll').scrollTop=0}
$('device-prev').onclick=()=>moveDevicePage(-1);$('device-next').onclick=()=>moveDevicePage(1);
$('device-reset').onclick=()=>{$('device-search').value='';$('device-status').value='all';$('device-os').value='all';$('device-sort').value='online';resetDevicePage()};
function render(){renderDevices();
syncDeviceSelect($('source'),state.devices.filter(d=>d.enabled));syncTargets();
renderRules()}
const groupOpen=new Map();let rulesSignature='';
function sshCommand(r){const quote=s=>"'"+s.replaceAll("'","'\"'\"'")+"'";return `ssh -p ${r.port} -l ${quote(state.devices.find(d=>d.id===r.target)?.username||'用户名')} 127.0.0.1`}
async function copyCommand(command,button){try{await navigator.clipboard.writeText(command);button.textContent='已复制';$('copy-status').textContent='SSH 命令已复制，请在对应访问端的终端执行。';setTimeout(()=>{if(button.isConnected)button.textContent='复制'},2000)}catch(e){$('copy-status').textContent='无法访问剪贴板，请选中 SSH 命令手动复制。'}}
function renderRules(){
 const query=$('rule-search').value.trim().toLowerCase();
 const signature=JSON.stringify([query,state.rules,state.devices.map(d=>[d.id,d.name,d.os,d.macs,d.username])]);
 if(signature===rulesSignature)return;rulesSignature=signature;
 const groups=new Map();
 for(const r of state.rules){const info=id=>{const d=state.devices.find(d=>d.id===id);return [id,d?.name,d?.os,...(d?.macs||[])].join(' ')};if(query&&!`${info(r.source)} ${info(r.target)} ${r.port}`.toLowerCase().includes(query))continue;if(!groups.has(r.source))groups.set(r.source,[]);groups.get(r.source).push(r)}
 const rules=$('rules');rules.replaceChildren();
 const ordered=[...groups].sort(([a],[b])=>{const label=id=>state.devices.find(d=>d.id===id)?.name||id;return label(a).localeCompare(label(b),'zh-CN')||a.localeCompare(b)});
 let visible=0;
 for(const [source,grants] of ordered){visible+=grants.length;const group=document.createElement('details');group.className='rule-group';group.dataset.source=source;if(!groupOpen.has(source))groupOpen.set(source,groupOpen.size===0);group.open=query?true:groupOpen.get(source);group.ontoggle=()=>{if(group.isConnected&&!$('rule-search').value.trim())groupOpen.set(source,group.open)};
 const summary=document.createElement('summary');summary.append(deviceSummary(source));const count=text('span',`${grants.length} 个目标`);count.className='group-count';summary.append(count);group.append(summary);
 const wrapper=document.createElement('div');wrapper.className='rule-table';const table=document.createElement('table');const head=document.createElement('thead');const headings=document.createElement('tr');for(const label of ['目标端','在此访问端执行的 SSH 命令','操作'])headings.append(text('th',label));head.append(headings);table.append(head);const body=document.createElement('tbody');
 for(const r of grants.sort((a,b)=>a.port-b.port)){const row=document.createElement('tr');cell(row,deviceSummary(r.target));const command=document.createElement('div');command.className='command';const value=sshCommand(r);command.append(text('code',value));const copy=text('button','复制');copy.type='button';copy.setAttribute('aria-label',`复制到 ${state.devices.find(d=>d.id===r.target)?.name||r.target} 端口 ${r.port} 的 SSH 命令`);copy.onclick=()=>copyCommand(value,copy);command.append(copy);cell(row,command);const revoke=text('button','撤销');revoke.type='button';revoke.className='danger';revoke.onclick=()=>action('/api/rules',{...r,port:undefined,allow:false});cell(row,revoke);body.append(row)}
 table.append(body);wrapper.append(table);group.append(wrapper);rules.append(group)}
 $('rules-count').textContent=query?`匹配 ${groups.size} 个访问端 · ${visible} 条授权 / 共 ${state.rules.length} 条`:`${groups.size} 个访问端 · ${visible} 条授权`;
 if(!visible){const empty=text('div',query?'没有匹配的连接，请尝试其他机器名、设备 ID、MAC 或端口。':'暂无授权连接，请先添加访问权限。');empty.className='empty';rules.append(empty)}
 $('expand-all').disabled=!visible;$('collapse-all').disabled=!visible;
}
$('rule-search').oninput=renderRules;
function setAllGroups(open){for(const group of $('rules').querySelectorAll('details.rule-group')){groupOpen.set(group.dataset.source,open);group.open=open}}
$('expand-all').onclick=()=>setAllGroups(true);$('collapse-all').onclick=()=>setAllGroups(false);

function syncDeviceSelect(select,devices){const options=devices.map(d=>({value:d.id,label:(d.name||'未命名')+' · '+d.id.slice(-8)}));const current=[...select.options].map(o=>({value:o.value,label:o.textContent}));if(JSON.stringify(current)===JSON.stringify(options))return;const prev=select.value;select.replaceChildren();for(const o of options){const option=text('option',o.label);option.value=o.value;select.append(option)}if(options.some(o=>o.value===prev))select.value=prev}
function syncTargets(){const source=$('source').value;syncDeviceSelect($('target'),state.devices.filter(d=>d.enabled&&d.id!==source));$('allow').disabled=!source||!$('target').value}
$('source').onchange=syncTargets;
$('grant').onsubmit=e=>{e.preventDefault();const source=$('source').value,target=$('target').value;if(!source||!target||source===target){$('message').textContent='请选择两台不同的设备';return}action('/api/rules',{source,target,allow:true})};refresh();setInterval(refresh,5000);
</script></html>
